# Service-конфиг nginx для мед-лендингов.
#
# Два отдельных server-блока:
# 1. lekon.libera.pro → /usr/share/nginx/med/lekon (персонализированный для Лекон)
# 2. med.libera.pro   → /usr/share/nginx/med/generic (универсальный, без упоминания конкретной клиники)
#
# Сертификат — ОБЩИЙ (cv-le-*.pem), SAN на 4 домена.
# entrypoint.sh подставляет SSL_CERT/SSL_KEY/SSL_CHAIN_CERT.

# --- lekon.libera.pro (персонализированный) ---
server {
    listen      9443 ssl;
    server_name lekon.libera.pro;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    access_log on;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        root   /usr/share/nginx/med/lekon;
        index  index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}

# --- med.libera.pro (универсальный) ---
server {
    listen      9443 ssl;
    server_name med.libera.pro;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    access_log on;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        root   /usr/share/nginx/med/generic;
        index  index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
