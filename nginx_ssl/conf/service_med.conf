# Service-конфиг nginx для мед-лендингов: lekon.libera.pro + med.libera.pro
#
# Подключается в web_nginx дополнительно к service_cv.conf.
# entrypoint.sh контейнера автоматически подхватывает все service*.conf,
# подставляя пути к SSL-сертификатам (через переменные SSL_CERT/SSL_KEY/SSL_CHAIN_CERT).
#
# Сертификат — ОБЩИЙ с cv.libera.pro (cv-le-*.pem), с SAN на 4 домена:
#   cv.libera.pro, libera.pro, lekon.libera.pro, med.libera.pro
# Это управляется одной переменной LE_FQDN в .env и одним процессом autorenewal.

server {
    listen      9443 ssl;
    # entrypoint.sh подставит сюда LE_FQDN — но это плейсхолдер для server_name,
    # нам нужны конкретные домены. Поэтому используем server_name явно ниже,
    # а LE_FQDN в этом файле не нужен (он нужен только в service_cv.conf).
    server_name lekon.libera.pro med.libera.pro;

    # Те же сертификаты, что и у cv.libera.pro (общий SAN).
    # entrypoint.sh сделает sed-подстановку:
    #   SSL_CERT  → /etc/nginx/ssl/cv-le-crt.pem
    #   SSL_KEY   → /etc/nginx/ssl/cv-le-key.pem
    #   SSL_CHAIN_CERT → /etc/nginx/ssl/cv-le-chain-crt.pem
    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    access_log on;

    # webroot для ACME-челленджа Let's Encrypt (certbot пишет сюда).
    # Тот же путь, что и в service_cv.conf.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Статика мед-лендинга. Корень сайта.
    # bind-mount /home/deploy/med/site → /usr/share/nginx/med (см. docker-compose.prod.yml).
    location / {
        root   /usr/share/nginx/med;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Кеширование статики — лендинг меняется редко.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
