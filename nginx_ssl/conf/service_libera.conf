# Service-конфиг nginx для главной страницы libera.pro (статика Next.js export).
#
# Подключается в web_nginx дополнительно к service_cv.conf и service_med.conf.
# entrypoint.sh контейнера автоматически подхватывает все service*.conf,
# подставляя пути к SSL-сертификатам (через переменные SSL_CERT/SSL_KEY/SSL_CHAIN_CERT).
#
# server_name libera.pro — ТОЧНОЕ совпадение, перехватывает apex-домен
# до дефолтного cv-server-блока (у того server_name содержит плейсхолдеры
# example.com и потому служит дефолтным для :9443 ssl). Это не затрагивает
# cv.libera.pro — он продолжает обслуживаться своим блоком.
#
# Сертификат — ОБЩИЙ с cv.libera.pro (cv-le-*.pem), с SAN на 4 домена:
#   cv.libera.pro, libera.pro, lekon.libera.pro, med.libera.pro
# Это управляется одной переменной LE_FQDN в .env и одним процессом autorenewal.

server {
    listen      9443 ssl;
    server_name libera.pro;

    # Те же сертификаты, что и у cv.libera.pro (общий SAN).
    # entrypoint.sh сделает sed-подстановку:
    #   SSL_CERT  → /etc/nginx/ssl/cv-le-crt.pem
    #   SSL_KEY   → /etc/nginx/ssl/cv-le-key.pem
    #   SSL_CHAIN_CERT → /etc/nginx/ssl/cv-le-chain-crt.pem
    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    access_log on;

    # webroot для ACME-челленджа Let's Encrypt (certbot пишет сюда).
    # Тот же путь, что и в service_cv.conf / service_med.conf.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Статика главной страницы. Корень сайта.
    # bind-mount /home/deploy/libera/site → /usr/share/nginx/libera (см. docker-compose.prod.yml).
    location / {
        root   /usr/share/nginx/libera;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Кеширование статики — визитка меняется редко.
        # HTML не кешируем (чтобы обновления применялись сразу),
        # медиа и _next — агрессивно.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
