[project]
name = "cv-backend"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-slugify>=8.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.7",
    "fpdf2>=2.7",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 — Depends()/File() в аргументах FastAPI (стандартный паттерн, false positive)
# S110 — try/except/pass (намеренное подавление ошибок декомпозиции)
# BLE001 — bare except Exception (намеренный fallback в streaming/error handling)
# PIE810 — startswith tuple merge (читаемость важнее)
# SIM102 — nested if merge (читаемость важнее)
# RUF059 — unused unpacked variable в тестах
# RUF012 — mutable class attr в тестах (mock objects)
ignore = ["B008", "S110", "BLE001", "PIE810", "SIM102", "RUF059", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: real LLM calls (slow, not in default CI)"]
addopts = "-m 'not e2e'"
