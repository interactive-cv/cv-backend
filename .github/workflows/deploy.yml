name: deploy backend to prod

# Автодеплой при merge feature-ветки в master.
# Merge в master = осознанный деплой (review пройден, CI зелёный).
#
# Требует Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY — приватный SSH-ключ для доступа к VPS
#   DEPLOY_HOST    — адрес VPS
#   DEPLOY_USER    — SSH-пользователь на VPS
#
# Деплоит только бэкенд (fastapi + nginx). Фронт деплоит отдельный workflow
# репозитория cv-frontend: так два merge подряд не перезаписывают код друг
# друга и не собирают один и тот же контейнер дважды.
#
# Механизм: rsync из runner → VPS, затем на VPS выполняется deploy/deploy-backend.sh
# (сборка → миграции → переключение контейнеров; подробности — в скрипте).
# .env на проде НЕ перезаписывается (содержит реальные секреты).

on:
  push:
    branches: [master]
  # Ручной запуск для дебага/повтора упавшего деплоя.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout cv-backend
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: rsync cv-backend → VPS
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='.venv' --exclude='.git' \
            --exclude='__pycache__' --exclude='*.egg-info' \
            --exclude='.pytest_cache' --exclude='.ruff_cache' \
            --exclude='artifacts/' \
            --exclude='DEPLOY_RULES.md' \
            --exclude='seed_data/master_cv.md' \
            --exclude='seed_data/projects.json' \
            --exclude='seed_data/readme.md' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/libera_cv/cv-backend/

      - name: Deploy on VPS (detached)
        # Долгая ssh-сессия раннер(US)→VPS(РФ) рвётся по транзиту, поэтому
        # деплой запускается nohup'ом на сервере (deploy/deploy-backend.sh), а результат
        # опрашивается короткими сессиями. Лог: /tmp/deploy_ci.log.
        # Сборка может идти долго: базовые образы качаются из Docker Hub
        # медленно. Всё это время прод работает на прежних контейнерах, поэтому
        # ждём до 45 минут и различаем «ещё выполняется» и «упало».
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          $SSH 'rm -f /tmp/deploy_ci.done /tmp/deploy_ci.log; nohup bash -c "bash /home/deploy/libera_cv/cv-backend/deploy/deploy-backend.sh > /tmp/deploy_ci.log 2>&1; echo \$? > /tmp/deploy_ci.done" >/dev/null 2>&1 & echo launched'
          rc=""
          for i in $(seq 1 270); do
            sleep 10
            rc=$($SSH 'cat /tmp/deploy_ci.done 2>/dev/null || true' 2>/dev/null || true)
            if [ -n "$rc" ]; then break; fi
          done
          $SSH 'tail -40 /tmp/deploy_ci.log 2>/dev/null' || true
          if [ -z "$rc" ]; then
            echo "⏳ деплой ещё выполняется на сервере — прод работает на прежней версии. Лог на VPS: /tmp/deploy_ci.log"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "❌ deploy failed (rc=$rc). Прод остаётся на прежней версии, если сбой был до переключения."
            exit 1
          fi
          echo "✅ deploy OK"
      - name: Smoke test
        run: |
          for i in 1 2 3; do
            if curl -sf https://cv.libera.pro/api/health | grep -q '"ok"'; then
              echo "✅ деплой завершён"
              exit 0
            fi
            echo "Попытка $i — не готово, ждём..."
            sleep 5
          done
          echo "❌ smoke failed"
          exit 1
